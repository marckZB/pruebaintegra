spring.application.name=fragrance-app
server.port=${PORT:8081}

# =============================================
# Configuracion MySQL - Laboratorio 09 estilo
# =============================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bd_fragrances?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Optimizacion de conexiones para Clever Cloud (limite de 5 conexiones)
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=20000
spring.datasource.hikari.max-lifetime=60000

# Thymeleaf
spring.thymeleaf.cache=false


